version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      expo:
        patterns: ['expo*', '@expo/*', 'react', 'react-dom', 'react-native*']
      better-auth:
        patterns: ['better-auth', '@better-auth/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
